<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Battleship</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="battleship.css" />
  <link rel="stylesheet" href="viewmode.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <div class="app">
    <a class="back-home" href="index.html">← All games</a>
    <header class="header">
      <h1 class="brand">Battleship</h1>
      <p class="tagline">Place ships · sink the fleet</p>
    </header>
    <p id="status" class="status-line">Place your ships (click cells)</p>
    <p id="score" class="score-line">Ships left — You: 4 · Enemy: 4</p>
    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn" data-view="2d">2D</button>
        <button type="button" class="view-btn" data-view="3d">3D</button>
      </div>
      <button id="btn-rotate" class="btn btn-ghost" type="button">Rotate ship</button>
      <button id="btn-new" class="btn" type="button">New game</button>
    </div>
    <div class="view-stage" data-view-stage>
      <div class="bs-wrap">
        <div>
          <p class="bs-label">Your fleet</p>
          <div id="player-board" class="bs-board" aria-label="Your board"></div>
        </div>
        <div>
          <p class="bs-label">Enemy waters</p>
          <div id="enemy-board" class="bs-board" aria-label="Enemy board"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="viewmode.js"></script>
  <script src="battleship.js"></script>
</body>
</html>
