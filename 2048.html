<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>2048</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="g2048.css" />
  <link rel="stylesheet" href="viewmode.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <div class="app">
    <a class="back-home" href="index.html">← All games</a>
    <header class="header">
      <h1 class="brand">2048</h1>
      <p class="tagline">Merge tiles · reach 2048</p>
    </header>
    <p class="score-line">Score <strong id="score">0</strong> · Best <strong id="best">0</strong></p>
    <p id="status" class="status-line">Swipe or use arrow keys</p>
    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn" data-view="2d">2D</button>
        <button type="button" class="view-btn" data-view="3d">3D</button>
      </div>
      <button id="btn-new" class="btn" type="button">New game</button>
    </div>
    <div class="view-stage" data-view-stage>
      <div id="board" class="board-2048" aria-label="2048 board"></div>
    </div>
  </div>
    <script src="viewmode.js"></script>
  <script src="g2048.js"></script>
</body>
</html>
