<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UNO</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="uno.css" />
  <link rel="stylesheet" href="viewmode.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <div class="app">
    <a class="back-home" href="index.html">← All games</a>
    <header class="header">
      <h1 class="brand">UNO</h1>
      <p class="tagline">You vs 3 AIs · match color or number</p>
    </header>
    <p id="status" class="status-line">Your turn</p>
    <p id="score" class="score-line">Draw pile ready</p>
    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn" data-view="2d">2D</button>
        <button type="button" class="view-btn" data-view="3d">3D</button>
      </div>
      <button id="btn-draw" class="btn btn-ghost" type="button">Draw</button>
      <button id="btn-uno" class="btn btn-ghost" type="button">UNO!</button>
      <button id="btn-new" class="btn" type="button">New game</button>
    </div>
    <div class="view-stage view-stage-fill" data-view-stage>
      <div class="uno-layout">
        <div id="opponents" class="uno-ops" aria-label="Opponents"></div>
        <div class="uno-table">
          <div id="discard" class="uno-pile" aria-label="Discard"></div>
          <button id="draw-pile" class="uno-back" type="button" aria-label="Draw pile">UNO</button>
        </div>
        <div id="hand" class="uno-hand" aria-label="Your hand"></div>
        <div id="wild-pick" class="wild-pick hidden" role="dialog" aria-label="Choose color">
          <button type="button" data-color="R" class="wc r">Red</button>
          <button type="button" data-color="Y" class="wc y">Yellow</button>
          <button type="button" data-color="G" class="wc g">Green</button>
          <button type="button" data-color="B" class="wc b">Blue</button>
        </div>
      </div>
    </div>
  </div>
  <script src="viewmode.js"></script>
  <script src="uno.js"></script>
</body>
</html>
