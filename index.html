<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — Chess & Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="home">
    <header class="home-header">
      <p class="eyebrow">Jugaad Online</p>
      <h1 class="home-brand">Games</h1>
      <p class="home-lead">Choose a board. Play in the browser.</p>
    </header>

    <main class="card-grid" aria-label="Choose a game">
      <a class="game-card game-card-chess" href="chess.html">
        <span class="card-visual" aria-hidden="true">♚</span>
        <span class="card-body">
          <span class="card-title">Chess</span>
          <span class="card-desc">Play the computer with hardness that levels up when you win.</span>
          <span class="card-cta">Play Chess</span>
        </span>
      </a>

      <a class="game-card game-card-sudoku" href="sudoku.html">
        <span class="card-visual" aria-hidden="true">9</span>
        <span class="card-body">
          <span class="card-title">Sudoku</span>
          <span class="card-desc">Fill the grid so every row, column, and box has 1–9 once.</span>
          <span class="card-cta">Play Sudoku</span>
        </span>
      </a>
    </main>
  </div>
</body>
</html>
