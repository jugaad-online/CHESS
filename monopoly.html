<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Monopoly</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="monopoly.css" />
  <link rel="stylesheet" href="viewmode.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <div class="app wide">
    <a class="back-home" href="index.html">← All games</a>
    <header class="header">
      <h1 class="brand">Monopoly</h1>
      <p class="tagline">You vs 2 AIs · buy, rent, race for riches</p>
    </header>
    <p id="status" class="status-line">Roll the dice</p>
    <p id="score" class="score-line">You $1500</p>
    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn" data-view="2d">2D</button>
        <button type="button" class="view-btn" data-view="3d">3D</button>
      </div>
      <button id="btn-roll" class="btn" type="button">Roll</button>
      <button id="btn-buy" class="btn btn-ghost" type="button" disabled>Buy</button>
      <button id="btn-end" class="btn btn-ghost" type="button" disabled>End turn</button>
      <button id="btn-new" class="btn btn-ghost" type="button">New game</button>
    </div>
    <div class="view-stage view-stage-fill" data-view-stage>
      <div class="mono-wrap">
        <div id="board" class="mono-board" aria-label="Monopoly board"></div>
        <aside id="panel" class="mono-panel"></aside>
      </div>
    </div>
  </div>
  <script src="viewmode.js"></script>
  <script src="monopoly.js"></script>
</body>
</html>
