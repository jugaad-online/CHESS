<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mastermind</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mastermind.css" />
  <link rel="stylesheet" href="viewmode.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <div class="app">
    <a class="back-home" href="index.html">← All games</a>
    <header class="header">
      <h1 class="brand">Mastermind</h1>
      <p class="tagline">Crack the 4-color code</p>
    </header>
    <p id="status" class="status-line">Guess 1 of 8</p>
    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn" data-view="2d">2D</button>
        <button type="button" class="view-btn" data-view="3d">3D</button>
      </div>
      <button id="btn-submit" class="btn" type="button">Submit guess</button>
      <button id="btn-new" class="btn btn-ghost" type="button">New game</button>
    </div>
    <div class="view-stage" data-view-stage>
      <div class="mm-wrap">
        <div id="rows" class="mm-rows" aria-label="Guesses"></div>
        <div class="mm-palette" id="palette" aria-label="Colors"></div>
        <p class="mm-hint">Black = exact · White = right color, wrong spot</p>
      </div>
    </div>
  </div>
  <script src="viewmode.js"></script>
  <script src="mastermind.js"></script>
</body>
</html>
